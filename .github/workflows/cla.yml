# Asks first-time contributors to sign CLA.md by commenting on their pull request.
# Signatures are stored in signatures/cla.json on the cla-signatures branch.
# The action never checks out or runs pull request code.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/chethandvg/vedic-astrology-toolkit/blob/main/CLA.md
          branch: cla-signatures
          allowlist: chethandvg,dependabot[bot],github-actions[bot]
