<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vedic-astrology-toolkit/favicon.svg" />
    <link rel="apple-touch-icon" href="/vedic-astrology-toolkit/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <script>
      // Apply the saved theme before first paint (mirrors applyTheme in src/state/settings.ts).
      try {
        var pref = (JSON.parse(localStorage.getItem('jyotish-daily:settings:v1') || '{}') || {}).theme || 'dark'
        var light = pref === 'light' || (pref === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
      } catch (e) {}
    </script>
    <title>Jyotish Daily: private Vedic astrology forecasts</title>
    <meta name="description" content="Free, open-source Vedic astrology: your birth chart, dasha periods and daily, weekly, monthly and yearly guidance from classical rules. Computed on your device; your birth details never leave it." />
    <meta property="og:title" content="Jyotish Daily: private Vedic astrology forecasts" />
    <meta property="og:description" content="Birth chart, dashas, transits, Rahu Kalam and daily to yearly guidance. Open source and computed on your device." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chethandvg.github.io/vedic-astrology-toolkit/" />
    <meta property="og:site_name" content="Jyotish Daily" />
    <meta property="og:image" content="https://chethandvg.github.io/vedic-astrology-toolkit/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jyotish Daily: Your Vedic sky, day by day. Private Vedic astrology, computed on your device." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image:alt" content="Jyotish Daily: Your Vedic sky, day by day. Private Vedic astrology, computed on your device." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
